version: "3.3"

services:
  telegram_media_downloader:
    # Upstream image. To run your own fork build (auto-built by
    # .github/workflows/docker-publish-ghcr.yml on every push to master), use:
    #   image: ghcr.io/jackxunkun163/telegram_media_downloader:latest
    image: tangyoha/telegram_media_downloader:latest
    build: .
    ports:
      # Here is what you need to edit
      - "5000:5000"
    #environment:
    #  - http_proxy=http://192.168.101.30:10811
    #  - https_proxy=http://192.168.101.30:10811
    volumes:
      # Here is what you need to edit
      - "./downloads/:/app/downloads/"

      # Rclone
      - "$HOME/.config/rclone/:$HOME/.config/rclone/"

      # The following is what you don't need to edit
      - "./config.yaml:/app/config.yaml"
      - "./data.yaml:/app/data.yaml"
      - "./log/:/app/log/"
      - "./sessions/:/app/sessions"
      - "./temp/:/app/temp"

    # Auto-restart after crashes or OOM kills; without this a dead process
    # leaves the container stopped until manually restarted.
    restart: unless-stopped

    # Liveness probe against the built-in web port (matches web_port in
    # config.yaml, default 5000). Docker marks the container unhealthy and
    # restarts it when the process stops answering.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
